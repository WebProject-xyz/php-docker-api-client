on:
  push:
    branches:
      - "main"
  pull_request:

name: "CI"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  ci:
    uses: "WebProject-xyz/.github/.github/workflows/ci.yml@dec2eb1cd3cfeded884d25c7b73d9d3f04ec69f7" # main
    secrets: inherit
    with:
      php-cs-fixer-ignore-env: true
      php-extensions: ""
      test-matrix: |
        [
          {"php-version": "8.3", "dependencies": "locked",  "with_coverage": true},
          {"php-version": "8.4", "dependencies": "highest", "with_coverage": false},
          {"php-version": "8.5", "dependencies": "highest", "with_coverage": false}
        ]
